<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Periodic Table - Kasatria Assignment</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- 3D Libraries & Utilities -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>

<body>

    <!-- Login Modal -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p>Sign in to view the visualization</p>
            <button onclick="triggerGoogleLogin()" style="
                background: #fff; 
                color: #757575; 
                border: 1px solid #ddd; 
                padding: 10px 20px; 
                border-radius: 4px; 
                font-family: Roboto, sans-serif; 
                font-size: 14px; 
                font-weight: 500; 
                cursor: pointer; 
                display: inline-flex; 
                align-items: center; 
                gap: 10px;
                margin-top: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18"
                    alt="Google Logo">
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- 3D Viewport -->
    <div id="container"></div>

    <!-- Control Buttons -->
    <div id="menu">
        <button id="table">TABLE</button>
        <button id="sphere">SPHERE</button>
        <button id="helix">HELIX</button>
        <button id="grid">GRID</button>
        <button id="tetrahedron">TETRAHEDRON</button>
    </div>

    <!-- Legend -->
    <div id="legend">
        <span class="legend-label">LOW</span>
        <div class="legend-bar"></div>
        <span class="legend-label">HIGH</span>
    </div>

    <script src="app.js"></script>

    <!-- Developer Credit Overlay -->
    <div id="author-credit" style="
    position: absolute; 
    top: 15px; 
    left: 20px; 
    color: rgba(255, 255, 255, 0.6); 
    font-family: sans-serif; 
    font-size: 12px; 
    letter-spacing: 1px;
    z-index: 10;">
        EDITOR: <strong style="color: #fff;">AHMAD AMIRUL FAIZ BIN NAZRI</strong>
    </div>
</body>

</html>
